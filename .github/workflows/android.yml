
name: Nova-Print APK bauen

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Nova-Print Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK vorbereiten
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -name sdkmanager -type f | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK Manager nicht gefunden!"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

      - name: Gradle 8.9 einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Projekt-ZIP entpacken
        shell: bash
        run: |
          mkdir -p extracted

          unzip -q Nova-Print-0.1-Quellcode.zip \
            -d extracted

          PROJECT=$(find extracted -type f \
            -name settings.gradle.kts -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "Android-Projekt nicht gefunden!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projekt gefunden: $PROJECT_DIR"

      - name: Android APK bauen
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug \
            --no-daemon --stacktrace

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Nova-Print-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
