
name: Nova-Print APK bauen

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Nova-Print Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Gradle 8.9 einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Projekt-ZIP entpacken
        shell: bash
        run: |
          mkdir -p extracted
          unzip -q Nova-Print-0.1-Quellcode.zip -d extracted

          PROJECT=$(find extracted -type f -name settings.gradle.kts -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "FEHLER: Android-Projekt nicht gefunden!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT")
          echo "Projekt gefunden: $PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Android APK bauen
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Nova-Print-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
